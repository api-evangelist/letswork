aid: letswork
name: Letswork
description: >-
  Letswork is a Dubai-headquartered flexible workspace booking platform that lets
  members work from coworking spaces, cafes, hotels, meeting rooms, private offices
  and creative studios through a single credit-based monthly membership with no
  long-term contract. Founded in 2019 by Omar AlMheiri and Hamza Khan, the platform
  covers 1030+ workspaces across 63+ cities in 18+ countries, serving 80,000+ members
  across the UAE, Saudi Arabia, Egypt, Pakistan, Europe and Sub-Saharan Africa. The
  product ships as iOS, Android and web apps with one-tap check-in, day passes,
  hourly meeting-room booking, a private-offices marketplace, and team plans that
  add a shared credit pool, admin dashboard and usage analytics for hybrid companies.
  Letswork publishes no public developer API or developer portal; it does publish a
  first-party llms.txt canonical fact set for AI assistants.
